<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor PNG → JPG 80% + Upload</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Conversor de Imagens para JPG (80%)</h1>
  <p>Selecione até 10 imagens, arraste para a área ou cole com Ctrl+V:</p>
  
  <div id="dropzone">Arraste ou cole imagens aqui</div>
  <input type="file" id="input" accept="image/*,.tif,.tiff" multiple>
  
  <div class="downloads" id="downloads"></div>
  
  <button id="baixarTudo" style="display:none;">Baixar Tudo</button>
  <button id="uploadTudo" style="display:none;">📤 Fazer Upload e Gerar Links</button>
  
  <div class="loading" id="loading" style="display:none;">
    <div class="spinner"></div>
    <p>Fazendo upload das imagens...</p>
    <div id="progressoUpload"></div>
  </div>
  
  <div class="links-publicos" id="linksPublicos" style="display:none;">
    <h3>🔗 Links Públicos</h3>
    <div id="listaLinks"></div>
  </div>
  
  <div class="instrucoes" id="instrucoes" style="display:none;">
    <h3>📌 Como usar:</h3>
    <ol>
      <li>Clique em "Fazer Upload e Gerar Links"</li>
      <li>Aguarde o upload</li>
      <li>Copie os links gerados</li>
    </ol>
  </div>

  <!-- Script principal -->
  <script src="script.js"></script>
</body>
</html>
